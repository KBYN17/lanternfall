<title>Lanternfall — Keeper of the Last Flame</title>
<style>

</style>

<body>
<canvas id="game" aria-label="Lanternfall: steer your lantern to catch rising fireflies and feed the flame, dodge the falling rain, survive each night and choose a boon"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
